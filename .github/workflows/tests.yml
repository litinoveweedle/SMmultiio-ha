name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: litinoveweedle/SMcommon-ha
          ref: 8060e7ee03c5626aa610a63f7dcd38aec22c692f
          path: .ci/SMcommon-ha
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: >-
          python -m pip install build
          'homeassistant==2026.11.1' 'pytest-homeassistant==2026.11.1'
          'SMmultiio>=1.0.0'
      - name: Build and install shared wheel
        run: |
          python -m build --wheel --outdir .ci/dist .ci/SMcommon-ha
          python -m pip install --no-deps .ci/dist/*.whl
      - name: Check shared dependency pin
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import version
          from packaging.requirements import Requirement

          with open("custom_components/smmultiio/manifest.json") as f:
              requirements = json.load(f)["requirements"]
          requirement = next(Requirement(r) for r in requirements if Requirement(r).name == "sequent-ha-common")
          installed = version("sequent-ha-common")
          if installed not in requirement.specifier:
              raise SystemExit(f"Shared wheel {installed} does not match {requirement}")
          PY
      - name: Run integration tests
        run: >-
          python -m pytest -p no:respx --asyncio-mode=auto
          -o asyncio_default_fixture_loop_scope=function -q tests
